name: Build & release skills
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      # Strict YAML, same as the tools that load skills (a lenient parser once hid two broken skills)
      - run: python scripts/studio.py check
      - run: python scripts/studio.py build
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

      - name: Tag must match plugin version, and have CHANGELOG notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PLUGIN=$(python -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          if [ "$TAG" != "$PLUGIN" ]; then
            echo "::error::Tag v$TAG does not match .claude-plugin/plugin.json version $PLUGIN (Claude Code uses it to detect updates)"
            exit 1
          fi
          python scripts/studio.py notes "$TAG" > release-notes.md
          test -s release-notes.md || { echo "::error::No '## v$TAG' section in CHANGELOG.md"; exit 1; }

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            dist/full-production-studio-all-skills.zip
            dist/zips/*.zip
            dist/prompts/*.md
