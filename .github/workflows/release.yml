name: Build & release skills
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/studio.py check
      - run: python scripts/studio.py build
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/full-production-studio-all-skills.zip
            dist/zips/*.zip
            dist/prompts/*.md
