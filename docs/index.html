<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root {
    --bg: #15171c; --panel: #1c1f26; --panel2: #232731; --line: #2c313c;
    --text: #eceef2; --muted: #9aa0aa; --dim: #8a909a; --on-orange: #15171c; --orange: #f47b20; --orange2: #ff9a45; --cream: #f6efe6;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
  :focus-visible { outline: 2px solid var(--orange2); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  body {
    margin: 0; font-family: 'Cairo', system-ui, sans-serif; color: var(--text); line-height: 1.6;
    background:
      radial-gradient(900px 500px at 80% -5%, rgba(244,123,32,.14), transparent 60%),
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px) 0 0 / 64px 64px,
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px) 0 0 / 64px 64px,
      var(--bg);
  }
  a { color: var(--orange2); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 0 20px; }

  header { display: flex; align-items: center; justify-content: space-between; padding: 18px 0; gap: 12px; }
  .brand { font-weight: 800; font-size: 18px; color: var(--text); display: flex; gap: 10px; align-items: center; }
  .brand b { color: var(--orange); }
  .top-actions { display: flex; gap: 10px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--panel);
    color: var(--text); padding: 8px 14px; border-radius: 999px; font: inherit; font-weight: 700; font-size: 14px; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { border-color: var(--orange); text-decoration: none; }
  .btn.primary { background: linear-gradient(145deg, var(--orange2), var(--orange)); border-color: transparent; color: var(--on-orange); }

  .hero { text-align: center; padding: 36px 0 20px; }
  .hero h1 { margin: 0; font-size: clamp(40px, 7vw, 76px); font-weight: 900; line-height: 1.25; }
  .hero h1 .o { color: var(--orange); }
  .hero .bar { width: 84px; height: 6px; border-radius: 4px; background: var(--orange); margin: 10px auto 16px; }
  .hero .eyebrow { margin: 0; font-size: clamp(20px, 3vw, 30px); font-weight: 700; color: #d9dbe0; }
  .hero .tagline { color: var(--muted); max-width: 720px; margin: 14px auto 0; font-size: 17px; }
  .hero-actions { display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; }

  .tiles { display: flex; justify-content: center; gap: 28px; margin: 34px 0 10px; flex-wrap: wrap; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; background: none; border: 0; color: inherit; font: inherit; }
  .tile .sq {
    width: 78px; height: 78px; border-radius: 20px; display: grid; place-items: center; font-size: 34px;
    background: linear-gradient(145deg, var(--orange2), var(--orange));
    box-shadow: 0 14px 30px rgba(0,0,0,.4), inset 0 -5px 0 rgba(0,0,0,.12);
    outline: 2px dashed rgba(255,255,255,.16); outline-offset: 6px; transition: transform .25s cubic-bezier(.16,1,.3,1);
  }
  .tile:nth-child(even) .sq { background: var(--cream); }
  .tile:hover .sq, .tile.active .sq { transform: translateY(-4px) scale(1.04); outline-color: var(--orange); }
  .tile span { font-weight: 800; }
  .tile small { color: var(--dim); font-size: 12px; letter-spacing: 1px; }

  .install {
    display: flex; align-items: center; gap: 10px; max-width: 640px; margin: 22px auto 0; background: #0f1114;
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 10px 10px 16px; direction: ltr;
  }
  .install code { flex: 1; color: #e7e9ee; font-size: 15px; overflow-x: auto; white-space: nowrap; text-align: left; }
  .install code::before { content: "$ "; color: var(--dim); }

  section { padding: 30px 0; }
  .sec-title { font-size: 26px; font-weight: 900; margin: 0 0 6px; }
  .sec-sub { color: var(--muted); margin: 0 0 20px; }

  .director {
    display: grid; grid-template-columns: 1.3fr 1fr; gap: 24px; align-items: center; background: var(--panel);
    border: 1px solid var(--line); border-radius: var(--radius); padding: 28px;
  }
  .director .flow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .director .flow span { background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 14px; font-weight: 700; }
  .director .flow i { color: var(--orange); font-style: normal; align-self: center; }
  .team-title { font-size: 15px; font-weight: 800; margin: 20px 0 8px; color: var(--text); }
  .team { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .team a { display: flex; flex-direction: column; gap: 2px; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; color: inherit; text-decoration: none; }
  .team a:hover, .team a:focus-visible { border-color: var(--orange); }
  .team b { font-size: 14px; }
  .team small { color: var(--dim); font-size: 12px; }
  .team code { align-self: flex-start; color: var(--orange2); font-size: 12px; direction: ltr; unicode-bidi: isolate; }
  .prompt { background: #0f1114; border: 1px dashed var(--orange); border-radius: 12px; padding: 18px; font-size: 17px; }
  .prompt small { color: var(--dim); display: block; margin-bottom: 6px; }

  .packs { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
  .pack { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .pack h3 { margin: 0; font-size: 18px; }
  .pack p { margin: 0; color: var(--muted); font-size: 13px; }

  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
  .search {
    flex: 1 1 260px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; color: var(--text);
    padding: 10px 18px; font: inherit; font-size: 15px; outline: none;
  }
  .search:focus { border-color: var(--orange); }
  .search:focus-visible { box-shadow: 0 0 0 2px var(--orange2); }
  .chip { background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
  .chip.active { background: var(--orange); border-color: var(--orange); color: var(--on-orange); }
  .count { color: var(--dim); font-size: 14px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 10px;
    transition: border-color .2s, transform .25s cubic-bezier(.16,1,.3,1);
  }
  .card:hover { border-color: #3a404d; transform: translateY(-2px); }
  .card .head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .card .name { font-weight: 800; font-size: 16px; direction: ltr; unicode-bidi: isolate; word-break: break-word; }
  .badge { font-size: 12px; font-weight: 800; border-radius: 999px; padding: 2px 10px; background: var(--panel2); border: 1px solid var(--line); white-space: nowrap; }
  .badge.star { color: var(--on-orange); background: var(--orange); border-color: var(--orange); }
  .card .desc { color: #c4c8d0; font-size: 14px; direction: ltr; text-align: left; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .card .meta { color: var(--dim); font-size: 13px; }
  .card .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; }
  .card .actions .btn { padding: 6px 12px; font-size: 13px; }
  .empty { color: var(--muted); text-align: center; padding: 40px; }

  .how { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 14px; }
  .how > div { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .how h3 { margin: 0; font-size: 17px; }
  .how p { margin: 0; color: var(--muted); font-size: 14px; }
  .how .lbl { color: var(--dim); font-size: 12.5px; font-weight: 700; margin-bottom: -4px; }
  .cmd {
    display: flex; align-items: center; gap: 8px; background: #0f1114; border: 1px solid var(--line); border-radius: 10px;
    padding: 6px 6px 6px 12px; direction: ltr;
  }
  .cmd code { flex: 1; min-width: 0; color: #e7e9ee; font-size: 13px; line-height: 1.5; white-space: normal; overflow-wrap: anywhere; text-align: left; }
  .cmd code.sh::before { content: "$ "; color: var(--dim); }
  .cmd .btn { padding: 5px 12px; font-size: 12.5px; }
  .how .go { align-self: flex-start; margin-top: auto; }
  .jump {
    display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; font-weight: 700;
    border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px; background: rgba(28,31,38,.6);
  }
  .jump:hover { color: var(--orange2); border-color: var(--orange); text-decoration: none; }

  footer { color: var(--dim); text-align: center; padding: 40px 0 60px; font-size: 14px; }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); opacity: 0;
    background: var(--orange); color: var(--on-orange); padding: 10px 18px; border-radius: 16px; font-weight: 800; transition: all .3s cubic-bezier(.16,1,.3,1); pointer-events: none;
    max-width: min(92vw, 560px); text-align: center; line-height: 1.5;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* proof */
  .proof { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 14px; }
  .proof-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .proof-card h3 { margin: 0; font-size: 18px; }
  .pv { display: flex; flex-direction: column; gap: 6px; }
  .pv .tag { align-self: flex-start; font-size: 12.5px; font-weight: 800; border-radius: 999px; padding: 2px 10px; border: 1px solid; }
  .pv.bad .tag { color: #ff8a80; border-color: rgba(255,138,128,.45); background: rgba(255,138,128,.08); }
  .pv.good .tag { color: #6ee7a8; border-color: rgba(110,231,168,.45); background: rgba(110,231,168,.08); }
  .pv img { width: 100%; height: auto; display: block; border-radius: 10px; border: 1px solid var(--line); }
  .pv.bad img { border-color: rgba(255,138,128,.35); }
  .pv.good img { border-color: rgba(110,231,168,.35); }
  .pv blockquote { margin: 0; padding: 12px 14px; border-radius: 10px; background: #0f1114; border: 1px solid var(--line); font-size: 16px; line-height: 1.7; direction: rtl; text-align: right; }
  .pv.bad blockquote { border-color: rgba(255,138,128,.35); color: #c4c8d0; }
  .pv.good blockquote { border-color: rgba(110,231,168,.35); color: var(--text); font-weight: 700; }
  .proof-card .pnote { color: var(--muted); font-size: 13.5px; margin: 0; }
  .proof-card .btn { align-self: flex-start; margin-top: auto; }
  .card .desc[dir="rtl"] { direction: rtl; text-align: right; }
  .card .name a { color: var(--text); }
  .card .name a:hover { color: var(--orange2); }
  .pack .about { color: #c4c8d0; font-size: 13.5px; margin: 0; }

  /* 3D stage */
  .stage { position: relative; height: clamp(320px, 30vw, 380px); margin: 10px -20px 0; display: none; touch-action: pan-y; }
  .stage-toggle {
    position: absolute; bottom: 8px; inset-inline-end: 28px; z-index: 2; background: rgba(21,23,28,.8); color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer;
  }
  .stage-toggle:hover { color: var(--text); border-color: var(--orange); }
  .stage-toggle[hidden] { display: none; }
  body.has3d .stage { display: block; }
  body.has3d .tiles { display: none; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .stage-labels { position: absolute; inset: 0; pointer-events: none; }
  .stage-label, .stage-pill {
    position: absolute; left: 0; top: 0; pointer-events: auto; opacity: 0; cursor: pointer;
    background: none; border: 0; color: var(--text); font: inherit; text-align: center; will-change: transform;
  }
  .stage-label { display: flex; flex-direction: column; align-items: center; line-height: 1.25; padding: 4px 10px; }
  .stage-label span { font-weight: 900; font-size: 22px; transition: color .2s; }
  .stage-label small { color: var(--dim); font-size: 12px; letter-spacing: 1.5px; }
  .stage-label.hot span, .stage-label:hover span, .stage-label:focus-visible span { color: var(--orange2); }
  .stage-pill {
    border: 1.5px solid var(--orange); color: var(--orange2); background: rgba(21,23,28,.75); backdrop-filter: blur(6px);
    border-radius: 999px; padding: 4px 16px; font-weight: 800; font-size: 14px; direction: ltr; white-space: nowrap;
  }
  .stage-pill:hover { background: var(--orange); color: var(--on-orange); }

  /* founder */
  .founder {
    display: grid; grid-template-columns: 170px 1fr; gap: 28px; align-items: center; background: var(--panel);
    border: 1px solid var(--line); border-radius: var(--radius); padding: 28px; position: relative; overflow: hidden;
  }
  .founder::after { content: ""; position: absolute; inset: auto -80px -120px auto; width: 320px; height: 320px; background: radial-gradient(circle, rgba(244,123,32,.18), transparent 65%); pointer-events: none; }
  .avatar {
    width: 170px; height: 170px; border-radius: 28px; overflow: hidden; background: linear-gradient(145deg, var(--orange2), var(--orange));
    display: grid; place-items: center; font-weight: 900; font-size: 54px; color: #fff;
    box-shadow: 0 18px 40px rgba(0,0,0,.45); outline: 2px dashed rgba(255,255,255,.16); outline-offset: 8px;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .founder .kicker { color: var(--orange2); font-weight: 800; font-size: 14px; letter-spacing: 1px; text-transform: uppercase; }
  .founder h2 { margin: 2px 0 2px; font-size: 30px; font-weight: 900; }
  .founder .role { color: var(--muted); font-weight: 700; margin-bottom: 10px; }
  .founder p { margin: 0 0 14px; color: #c9cdd4; max-width: 720px; }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .stats span { background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 700; }
  .stats b { color: var(--orange2); }

  @media (max-width: 760px) { .founder { grid-template-columns: 1fr; text-align: center; } .avatar { margin: 0 auto; width: 140px; height: 140px; } .stats { justify-content: center; } .founder p { margin-inline: auto; } }
  @media (max-width: 760px) { .director { grid-template-columns: 1fr; } .tiles { gap: 18px; } }
  @media (max-width: 520px) {
    .brand span { display: none; }
    .btn { padding: 7px 11px; font-size: 13px; }
    .tiles { gap: 12px; flex-wrap: nowrap; }
    .tile .sq { width: 60px; height: 60px; border-radius: 16px; font-size: 26px; outline-offset: 4px; }
    .tile span { font-size: 14px; }
    .grid { grid-template-columns: 1fr; }
    .stage { height: 440px; }
    .hero-actions .btn { white-space: normal; justify-content: center; text-align: center; max-width: 100%; }
    .stage-label span { font-size: 17px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">🎬 <span>Full <b>Production</b> Studio</span></div>
    <div class="top-actions">
      <button class="btn" id="langBtn" type="button">العربية</button>
      <a class="btn" href="https://github.com/alfaris/full-production-studio" data-i18n="github">★ GitHub</a>
    </div>
  </header>

  <div class="hero">
    <h1 dir="rtl" lang="ar">استوديو <span class="o">إنتاج</span> متكامل</h1>
    <div class="bar"></div>
    <p class="eyebrow" lang="en">Full Production Studio</p>
    <p class="tagline" data-i18n="tagline"></p>

    <div class="install">
      <code id="installAll" lang="en">npx skills add alfaris/full-production-studio</code>
      <button class="btn primary" type="button" data-copy-from="installAll" data-i18n="copy" data-i18n-aria="copyInstallAll">Copy</button>
    </div>
    <div class="hero-actions">
      <a class="btn" href="#install-chat" data-i18n="noTerm"></a>
      <a class="jump" href="#install" data-i18n="jump"></a>
    </div>

    <div class="stage" id="stage">
      <div class="stage-labels"></div>
      <button class="stage-toggle" id="motionBtn" type="button" aria-pressed="false" hidden></button>
    </div>
    <div class="tiles" id="tiles" role="group" data-i18n-aria="sectionsLabel"></div>
  </div>

  <section id="proof">
    <h2 class="sec-title" data-i18n="proofTitle"></h2>
    <p class="sec-sub" data-i18n="proofSub"></p>
    <div class="proof" id="proofGrid"></div>
  </section>

  <section id="director">
    <div class="director">
      <div>
        <h2 class="sec-title" data-i18n="dirTitle"></h2>
        <p class="sec-sub" data-i18n="dirSub"></p>
        <div class="flow" id="flow"></div>
        <h3 class="team-title" data-i18n="teamTitle"></h3>
        <div class="team" id="team"></div>
      </div>
      <div class="prompt">
        <small data-i18n="sayThis"></small>
        <div data-i18n="dirPrompt"></div>
      </div>
    </div>
  </section>

  <section>
    <h2 class="sec-title" data-i18n="packsTitle"></h2>
    <p class="sec-sub" data-i18n="packsSub"></p>
    <div class="packs" id="packs"></div>
  </section>

  <section id="skills">
    <h2 class="sec-title" data-i18n="skillsTitle"></h2>
    <p class="sec-sub" data-i18n="skillsSub"></p>
    <div class="controls">
      <label class="sr-only" for="q" data-i18n="searchLabel"></label>
      <input class="search" id="q" type="search" autocomplete="off">
      <div id="chips" role="group" data-i18n-aria="filterLabel" style="display:flex;gap:8px;flex-wrap:wrap"></div>
      <span class="count" id="count" aria-live="polite"></span>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="install">
    <h2 class="sec-title" data-i18n="howTitle"></h2>
    <div class="how" id="how"></div>

  <section id="founder">
    <div class="founder">
      <div class="avatar"><img src="founder.avif" width="170" height="170" alt="Ahmed Faris" loading="lazy" onerror="const a=this.parentNode; this.remove(); a.textContent='AF';"></div>
      <div>
        <div class="kicker" data-i18n="fKicker"></div>
        <h2 data-i18n="fName"></h2>
        <div class="role" data-i18n="fRole"></div>
        <p data-i18n="fBio"></p>
        <div class="stats" id="fStats"></div>
        <a class="btn primary" href="https://afaris.me/" target="_blank" rel="noopener" data-i18n="fCta"></a>
      </div>
    </div>
  </section>

  <footer>
    <div data-i18n="footer"></div>
    <div style="margin-top:6px"><a href="https://github.com/alfaris/full-production-studio#-credits" data-i18n="credits"></a></div>
  </footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<script>
const REPO = 'alfaris/full-production-studio';
const T = {
  en: {
    tagline: 'Open-source AI skills for video & content creators, from the first idea to the final export. A studio director that runs the whole pipeline, plus the first Arabic-first creator skills. Works with Claude, ChatGPT, Gemini, Codex and Cursor.',
    copy: 'Copy', copied: 'Copied ✓', github: '★ Star on GitHub',
    copiedInstall: 'Copied ✓ Paste it in your terminal, then tell your AI: “Use studio‑director. Make me a reel about ___.”',
    copiedPlugin: 'Copied ✓ Paste it inside Claude Code and press Enter.',
    noTerm: 'No terminal? Use it in Claude.ai or ChatGPT →',
    copyInstallAll: 'Copy the install command', sectionsLabel: 'Studio sections', filterLabel: 'Filter skills by section',
    searchLabel: 'Search skills', pause: '⏸ Pause animation', play: '▶ Play animation',

let DATA = null, lang = 'en', cat = 'all';
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SCROLL = REDUCED ? 'auto' : 'smooth';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const cmdFor = names => `npx skills add ${REPO} ` + names.map(n => `--skill ${n}`).join(' ');

function legacyCopy(text) {
  const a = document.createElement('textarea');
  a.value = text; a.setAttribute('readonly', ''); a.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
  document.body.appendChild(a); a.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch { ok = false; }
  a.remove(); return ok;
}
let toastTimer = 0;
function toast(msg, ms = 1600) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch { legacyCopy(text); }
  // Teach the next step at the moment it's needed
  if (text.startsWith('npx skills add')) toast(T[lang].copiedInstall, 6000);
  else if (text.startsWith('/plugin')) toast(T[lang].copiedPlugin, 4000);
  else toast(T[lang].copied);
}

function setLang(l) {
  lang = l; localStorage.setItem('fps-lang', l);
  document.documentElement.lang = l; document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  $('#langBtn').textContent = l === 'ar' ? 'English' : 'العربية';
  $('#langBtn').lang = l === 'ar' ? 'en' : 'ar';
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = T[l][el.dataset.i18n]; if (typeof v === 'string') el.innerHTML = v;
  });
  document.querySelectorAll('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', T[l][el.dataset.i18nAria]));
  $('#q').placeholder = T[l].search;
  updateMotionBtn();
  $('#flow').innerHTML = T[l].flow.map(s => `<span>${s}</span>`).join(`<i>${l === 'ar' ? '←' : '→'}</i>`);
  $('#team').innerHTML = T[l].team.map(([icon, role, skill, what]) =>
    `<a href="https://github.com/${REPO}/blob/main/skills/${skill}/SKILL.md"><b>${icon} ${role}</b><code lang="en">${skill}</code><small>${what}</small></a>`).join('');
  $('#fStats').innerHTML = T[l].fStats.map(x => `<span>${x}</span>`).join('');
  const pv = (cls, v) => `<div class="pv ${cls}"><span class="tag">${v.tag}</span>${v.img
      ? `<img src="${v.img}" alt="${esc(v.alt)}" loading="lazy" width="900" height="150">`
      : `<blockquote lang="ar">${v.text}</blockquote>`}</div>`;
  $('#proofGrid').innerHTML = T[l].proof.map(c => `<article class="proof-card">
      <h3>${c.h}</h3>${pv('bad', c.before)}${pv('good', c.after)}
      <p class="pnote">${c.note}</p>
      <button class="btn" type="button" data-copy="${esc(cmdFor([c.skill]))}">${T[l].tryIt(`<span lang="en" dir="ltr">${c.skill}</span>`)}</button>
    </article>`).join('');
  $('#how').innerHTML = T[l].how.map(c => `<div${c.id ? ` id="${c.id}"` : ''}>
      <h3>${c.h}</h3><p>${c.p}</p>
      ${(c.cmds || []).map(([lbl, cmd]) => `${lbl ? `<div class="lbl">${lbl}</div>` : ''}
        <div class="cmd"><code lang="en" class="${cmd.startsWith('/') ? '' : 'sh'}">${esc(cmd)}</code>
        <button class="btn primary" type="button" data-copy="${esc(cmd)}" aria-label="${T[l].aCopyCmd}: ${esc(cmd)}">${T[l].copy}</button></div>`).join('')}
      ${c.link ? `<a class="btn go" href="${c.link[0]}"${c.link[0].startsWith('http') ? ' target="_blank" rel="noopener"' : ''}>${c.link[1]}</a>` : ''}
    </div>`).join('');
  if (DATA) renderAll();
}

function catName(k) { const c = DATA.categories[k]; return lang === 'ar' ? c.ar : c.en; }

function renderAll() {
  const order = Object.keys(DATA.categories);
  $('#tiles').innerHTML = order.filter(k => k !== 'studio').map(k => {
    const c = DATA.categories[k];
    return `<button class="tile ${cat === k ? 'active' : ''}" data-cat="${k}" type="button" aria-pressed="${cat === k}"><div class="sq" aria-hidden="true">${c.icon}</div><span lang="ar">${c.ar}</span><small lang="en">${c.en.toUpperCase()}</small></button>`;
  }).join('');
  $('#chips').innerHTML = ['all', ...order].map(k =>
    `<button class="chip ${cat === k ? 'active' : ''}" data-cat="${k}" type="button" aria-pressed="${cat === k}">${k === 'all' ? T[lang].all : DATA.categories[k].icon + ' ' + catName(k)}</button>`).join('');
  $('#packs').innerHTML = DATA.packs.map(p => `
    <div class="pack">
      <h3>${p.icon} ${lang === 'ar' ? p.ar : p.en}</h3>
      <p class="about">${lang === 'ar' ? (p.about_ar || '') : (p.about || '')}</p>
      <p>${p.skills.length} ${T[lang].skills} · <span class="mono" dir="ltr" lang="en">${p.skills.slice(0, 3).join(', ')}${p.skills.length > 3 ? '…' : ''}</span></p>
      <button class="btn primary" type="button" data-copy="${esc(cmdFor(p.skills))}">${T[lang].install}</button>
    </div>`).join('');
  renderGrid();
}

function renderGrid() {
  const q = $('#q').value.trim().toLowerCase();
  const wantsArabic = /عرب|arab/.test(q);
  const list = DATA.skills.filter(s =>
    (cat === 'all' || s.category === cat) &&
    (!q || (s.name + ' ' + s.description + ' ' + (s.description_ar || '') + ' ' + s.repo).toLowerCase().includes(q) || (wantsArabic && s.name.startsWith('arabic'))));
  $('#count').textContent = T[lang].shown(list.length);
  $('#grid').innerHTML = list.length ? list.map(s => {
    const c = DATA.categories[s.category];
    return `<article class="card">
      <div class="head"><h3 class="name mono" lang="en" style="margin:0"><a href="https://github.com/${REPO}/blob/main/skills/${s.name}/SKILL.md" aria-label="${esc(T[lang].aView(s.name))}">${esc(s.name)}</a></h3><span class="badge ${s.original ? 'star' : ''}">${c.icon} ${catName(s.category)}</span></div>
      ${lang === 'ar' && s.description_ar
        ? `<div class="desc" lang="ar" dir="rtl">${esc(s.description_ar)}</div>`
        : `<div class="desc" lang="en">${esc(s.description)}</div>`}
      <div class="meta">${s.original ? T[lang].original + ' · ' : ''}${s.toolkit ? T[lang].toolkit + ' · ' : ''}<a href="https://github.com/${s.repo}" dir="ltr">${esc(s.repo.split('/')[0])}</a>${s.note ? ' · ' + esc(s.note) : ''}</div>
      <div class="actions">
        <button class="btn primary" type="button" data-copy="${esc(cmdFor([s.name]))}" aria-label="${esc(T[lang].aInstall(s.name))}">${T[lang].install}</button>
        <button class="btn" type="button" data-gpt="${s.name}" data-chars="${s.prompt_chars || 0}" aria-label="${esc(T[lang].gptAria(s.name))}">${T[lang].gpt}</button>
        <a class="btn" href="https://github.com/${REPO}/releases/latest/download/${s.name}.zip" aria-label="${esc(T[lang].aZip(s.name))}">${T[lang].zip}</a>
      </div>
    </article>`;
  }).join('') : `<div class="empty">${T[lang].none}</div>`;
}

const GPT_LIMIT = 8000; // ChatGPT custom GPT "Instructions" field limit
async function copyForChat(name, chars) {
  const url = `prompts/${name}.md`;
  if (chars > GPT_LIMIT) {            // too long to paste: download it to upload as Knowledge
    const a = document.createElement('a'); a.href = url; a.download = `${name}.md`;
    document.body.appendChild(a); a.click(); a.remove();
    toast(T[lang].gptTooLong(chars), 7000);
    return;
  }
  const load = fetch(url).then(r => { if (!r.ok) throw new Error(r.status); return r.text(); });
  try {                                 // 1) ClipboardItem keeps the click's permission while the file loads (Safari, Chrome)
    await navigator.clipboard.write([new ClipboardItem({ 'text/plain': load.then(t => new Blob([t], { type: 'text/plain' })) })]);
    toast(T[lang].gptCopied, 6000); return;
  } catch { /* fall through */ }
  let text = '';
  try { text = await load; } catch { /* network problem: open the file instead */ }
  if (text) {
    try { await navigator.clipboard.writeText(text); toast(T[lang].gptCopied, 6000); return; } catch { /* fall through */ }
    if (legacyCopy(text)) { toast(T[lang].gptCopied, 6000); return; }   // 3) older browsers / restricted clipboard
  }
  window.open(url, '_blank', 'noopener');                               // 4) last resort: show the file to copy by hand
  toast(T[lang].gptOpened, 7000);
}

document.addEventListener('click', e => {
  const g = e.target.closest('[data-gpt]');
  if (g) { copyForChat(g.dataset.gpt, +g.dataset.chars); return; }
  const b = e.target.closest('[data-copy],[data-copy-from],[data-cat]');
  if (!b) return;
  if (b.dataset.copy) copy(b.dataset.copy);
  else if (b.dataset.copyFrom) copy(document.getElementById(b.dataset.copyFrom).textContent);
  else if (b.dataset.cat) selectCat(b.dataset.cat, b.classList.contains('tile'));
});
function selectCat(k, fromHero) {
  cat = fromHero && cat === k ? 'all' : k;
  if (DATA) renderAll();
  if (fromHero) document.getElementById('skills').scrollIntoView({ behavior: SCROLL });
}
window.fpsSelectCat = k => selectCat(k, true);

// Pause / play for the 3D scene (WCAG 2.2.2). The scene registers itself on window.fpsStage.
function updateMotionBtn() {
  const b = $('#motionBtn'), st = window.fpsStage;
  if (!b || !st) return;
  b.hidden = st.reduced;               // the OS reduced-motion setting already keeps it still
  const paused = st.isStill();
  b.setAttribute('aria-pressed', String(paused));
  b.textContent = paused ? T[lang].play : T[lang].pause;
}
$('#motionBtn').addEventListener('click', () => {
  const st = window.fpsStage; if (!st) return;
  const paused = st.setStill(!st.isStill());
  localStorage.setItem('fps-motion', paused ? 'off' : 'on');
  updateMotionBtn();
});
$('#q').addEventListener('input', renderGrid);
window.addEventListener('fps-stage', updateMotionBtn);
$('#langBtn').addEventListener('click', () => setLang(lang === 'ar' ? 'en' : 'ar'));

setLang(localStorage.getItem('fps-lang') || ((navigator.language || '').startsWith('ar') ? 'ar' : 'en'));
fetch('data.json').then(r => r.json()).then(d => { DATA = d; renderAll(); })
  .catch(() => { $('#grid').innerHTML = '<div class="empty">Could not load skills. <a href="https://github.com/' + REPO + '">Open on GitHub</a></div>'; });
</script>
<script type="module">
  // 3D hero: progressive enhancement. If WebGL or the CDN fails, the flat tiles stay.
  try {
    const { mountStudio3D } = await import('./studio3d.js');
    document.body.classList.add('has3d'); // show the stage first so it has a size
    const ok = mountStudio3D(document.getElementById('stage'), {
      still: localStorage.getItem('fps-motion') === 'off',
      onSelect: k => window.fpsSelectCat(k),
      onDirector: () => document.getElementById('director').scrollIntoView({
        behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }),
    });
    if (!ok) document.body.classList.remove('has3d');
    else { window.fpsStage = ok; window.dispatchEvent(new Event('fps-stage')); }
  } catch (e) { document.body.classList.remove('has3d'); console.warn('3D hero disabled:', e); }
</script>
